# GitHub Pages へのデプロイ
#
# もともとは Pages の「ブランチから配信」設定にまかせて、GitHub が自動生成する
# pages-build-deployment ワークフローで配信していた。しかし GitHub 側の障害の
# あと、このリポジトリの Pages サイトが失われた状態になり
# (configure-pages が "Get Pages site failed. Error: Not Found" を返す)、
# 配信が復帰しなくなった:
#   - デプロイは登録されるが deployment_queued のまま進まず10分でタイムアウト
#     (配信先のサイトが無いので、処理されようがない)
#   - 再実行しても queued のままジョブが割り当てられない
#   - しかもキャンセルAPIは 409 Cannot cancel a workflow re-run that has not
#     yet queued を返し、取り消すこともできない
#
# Pages サイトの作成には管理者権限が必要で、ワークフローの GITHUB_TOKEN では
# 作成できない (configure-pages の enablement: true は
# "Resource not accessible by integration" で失敗する)。
# そのため、サイトの用意だけはリポジトリ設定で行う必要がある:
#
#   Settings → Pages → Source を「GitHub Actions」にする
#
# それさえ済めば、以降の配信はこのワークフローが行う。自動生成の
# ワークフローには戻らないので、詰まっていた経路を使わずに済む。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 再実行(re-run)が詰まったときのために、手動でも新しい実行を起こせるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 自動生成ワークフロー側のグループに巻き込まれないよう、別の名前にしている。
# 滞留している実行が同じグループを掴んでいると、こちらまで待たされてしまう。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # configure-pages は使わない。サイトが無い状態では Not Found で落ちるうえ、
      # 静的ファイルを上げるだけのこのサイトでは出力(base_url など)も使わない。

      # 静的ファイルだけのサイトなので、リポジトリ全体をそのまま上げる
      # (.git と .github はアクション側で除外される)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
